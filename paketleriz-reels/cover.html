<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melontik × paketleriz Reels Kapağı</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root { --brand: #FF7855; --brown: #4A1F14; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { width: 1080px; height: 1920px; font-family: Montserrat, sans-serif; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: linear-gradient(170deg, #FF7855 0%, #9C3F2A 30%, #1A0C08 58%, #000 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  #g1 { width: 1100px; height: 1100px; left: -300px; top: -480px; background: var(--brand); opacity: .55; }
  #g2 { width: 900px; height: 900px; left: 320px; top: 1320px; background: #000; opacity: .6; }
  #grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 120px 120px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent); }
  #frame { position: absolute; inset: 56px; border: 1px solid rgba(255,255,255,.18); border-radius: 36px; }

  /* content kept inside the 3:4 profile-grid crop (y 240–1680) */
  #content { position: absolute; left: 0; right: 0; top: 400px; display: flex; flex-direction: column; align-items: center; }

  #eyebrow { display: flex; align-items: center; gap: 22px; font-size: 30px; font-weight: 600; letter-spacing: 8px; }
  #eyebrow .rule { width: 90px; height: 2px; background: rgba(255,255,255,.7); }

  .card { width: 640px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  #mCard { height: 165px; margin-top: 60px; background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  #pCard { height: 260px; background: #0B0706; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .mIcon { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
           background: radial-gradient(circle at 35% 30%, #FF9B7C, var(--brand) 70%); }
  .mWord { font-family: Poppins, sans-serif; font-weight: 800; font-size: 86px; color: var(--brown);
           letter-spacing: -3px; line-height: 1; padding-bottom: 8px; }
  #pCard img { height: 215px; width: auto; }

  #xRow { display: flex; align-items: center; gap: 30px; width: 640px; height: 110px; }
  #xRow .rule { flex: 1; height: 1px; background: rgba(255,255,255,.45); }
  #xRow span { font-size: 60px; font-weight: 300; line-height: 1; transform: translateY(-4px); }

  #copy { margin-top: 56px; text-align: center; }
  #l1 { font-size: 36px; font-weight: 500; color: rgba(255,255,255,.85); margin-bottom: 14px; }
  .big { font-size: 80px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.08; }
  #l2 { color: var(--brand); }
  #tag { margin-top: 40px; display: flex; align-items: center; justify-content: center; gap: 22px;
         font-size: 28px; font-weight: 600; letter-spacing: 7px; color: rgba(255,255,255,.9); }
  #tag .rule { width: 70px; height: 3px; border-radius: 2px; background: var(--brand); }

  .guide { position: absolute; left: 0; right: 0; border: 3px dashed #0f0; pointer-events: none; display: none; }
  body.guides .guide { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="g1"></div>
  <div class="glow" id="g2"></div>
  <div id="grid"></div>
  <div id="frame"></div>

  <div id="content">
    <div id="eyebrow">
      <div class="rule"></div>
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
      </svg>
      <span>PARTNER İŞBİRLİĞİ</span>
      <div class="rule"></div>
    </div>

    <div class="card" id="mCard">
      <div class="mIcon">
        <svg width="60" height="60" viewBox="0 0 76 76" fill="none" stroke="#FFE7DE" stroke-width="9" stroke-linecap="round">
          <circle cx="21" cy="21" r="11"/><circle cx="55" cy="55" r="11"/><line x1="60" y1="14" x2="16" y2="62"/>
        </svg>
      </div>
      <div class="mWord">melontik</div>
    </div>
    <div id="xRow"><div class="rule"></div><span>×</span><div class="rule"></div></div>
    <div class="card" id="pCard"><img src="assets/paketleriz-logo-beyaz.svg" alt="paketleriz.com"></div>

    <div id="copy">
      <div id="l1">E-ticaret satıcılarına fulfillment çözümleri sunan</div>
      <div class="big" id="l2">paketleriz.com</div>
      <div class="big">müşterileri artık</div>
      <div class="big">Melontik kullanıyor</div>
      <div id="tag"><div class="rule"></div><span>MELONTİK PARTNER SİSTEMİ</span><div class="rule"></div></div>
    </div>
  </div>

  <div class="guide" style="top:240px;height:1440px"></div>
  <div class="guide" style="top:420px;height:1080px;border-color:#ff0"></div>
</div>
<script>
  if (new URLSearchParams(location.search).has('guides')) document.body.classList.add('guides');
</script>
</body>
</html>
