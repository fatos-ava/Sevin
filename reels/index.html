<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melontik × e-adam Reels</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root {
    --w: 1080px; --h: 1920px;
    --orange: #FF7A4D; --coral: #FF5A5F; --deep: #B8392C; --brown: #4A1F14; --ink: #1C0E0A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Montserrat, sans-serif; }
  #stage {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    transform-origin: center center; color: #fff; background: var(--deep);
  }
  body.capture { display: block; background: none; }
  body.capture #stage { transform: none !important; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }

  /* ---------- background ---------- */
  #bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .85; }
  #b1 { width: 900px; height: 900px; background: #FFB36B; }
  #b2 { width: 1000px; height: 1000px; background: #FF3D6E; }
  #b3 { width: 800px; height: 800px; background: #8E1F2A; }
  #streaks { position: absolute; inset: -400px; opacity: .14;
    background: repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 120px); }
  #grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay;
    background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 6px 6px; }
  #vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(40,6,4,.45) 100%); }

  /* ---------- logo cards ---------- */
  .card {
    width: 760px; height: 210px; border-radius: 48px;
    display: flex; align-items: center; justify-content: center; gap: 26px;
  }
  #mCard { background: #fff; box-shadow: 0 30px 80px rgba(90,20,10,.35); }
  #eCard { background: linear-gradient(135deg, #2A140E, #140806);
           box-shadow: 0 30px 80px rgba(40,5,0,.45); border: 2px solid rgba(255,255,255,.12); }
  .mIcon {
    width: 118px; height: 118px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FF9B72, #F2613F 70%);
    display: grid; place-items: center; box-shadow: 0 8px 20px rgba(242,97,63,.45);
  }
  .mWord { font-family: Poppins, sans-serif; font-weight: 800; font-size: 104px; color: var(--brown);
           letter-spacing: -3px; line-height: 1; padding-bottom: 8px; }
  #eCard img { width: 540px; height: auto; }

  #x {
    width: 150px; height: 150px; border-radius: 50%;
    background: #fff; color: var(--coral); display: grid; place-items: center;
    font-weight: 900; font-size: 96px; line-height: 1; box-shadow: 0 0 0 14px rgba(255,255,255,.22), 0 20px 50px rgba(0,0,0,.25);
  }
  #x span { transform: translateY(-6px); }
  #ring { width: 150px; height: 150px; border-radius: 50%; border: 10px solid #fff; }

  /* ---------- copy ---------- */
  #copy { width: 1080px; text-align: center; }
  .line { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 22px; }
  .w { display: inline-block; opacity: 0; }
  #l1 { font-size: 54px; margin-bottom: 18px; font-weight: 500; }
  #l1 .ty { font-style: italic; font-weight: 800; color: #fff; }
  #tyChip { display: inline-block; background: #F27A1A; padding: 4px 26px 10px; border-radius: 18px;
            transform: rotate(-3deg); box-shadow: 0 10px 30px rgba(120,40,0,.35); }
  #l2, #l3 { font-size: 104px; font-weight: 900; letter-spacing: -2px; line-height: 1.08; }
  #l3 { margin-top: 6px; }
  .hl { position: relative; }
  .hl::before { content: ""; position: absolute; left: 4px; right: 4px; bottom: -4px; height: 16px;
                background: #FFD166; border-radius: 12px; z-index: -1; transform-origin: left center;
                transform: scaleX(var(--s, 0)) skewX(-8deg); }
  .hl { isolation: isolate; }

  /* ---------- pill + footer ---------- */
  #pill {
    width: 720px; height: 110px; border-radius: 60px;
    background: rgba(255,255,255,.16); backdrop-filter: blur(14px);
    border: 2px solid rgba(255,255,255,.55);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 20px 50px rgba(80,10,0,.25);
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-size: 46px; font-weight: 700; letter-spacing: 4px; overflow: hidden;
  }
  #shine { position: absolute; top: -20px; width: 160px; height: 160px;
           background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-20deg); }
  #site { width: 1080px; text-align: center; font-size: 38px; font-weight: 600; letter-spacing: 3px; opacity: .9; }

  .spark { position: absolute; left: 0; top: 0; border-radius: 3px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="blob abs" id="b1"></div>
    <div class="blob abs" id="b2"></div>
    <div class="blob abs" id="b3"></div>
    <div id="streaks"></div>
    <div id="grain"></div>
    <div id="vignette"></div>
  </div>

  <div id="sparks"></div>

  <div class="abs" id="ring"></div>

  <div class="abs card" id="mCard">
    <div class="mIcon">
      <svg width="76" height="76" viewBox="0 0 76 76" fill="none" stroke="#FFE3D6" stroke-width="9" stroke-linecap="round">
        <circle cx="21" cy="21" r="11"/><circle cx="55" cy="55" r="11"/><line x1="60" y1="14" x2="16" y2="62"/>
      </svg>
    </div>
    <div class="mWord">melontik</div>
  </div>

  <div class="abs" id="x"><span>×</span></div>

  <div class="abs card" id="eCard"><img src="assets/eadam-logo.png" alt="e-adam"></div>

  <div class="abs" id="copy">
    <div class="line" id="l1">
      <span class="w"><span id="tyChip"><span class="ty">Trendyol</span></span></span>
      <span class="w">mağaza</span><span class="w">yönetiminde</span>
    </div>
    <div class="line" id="l2"><span class="w hl" id="hl1">Melontik</span></div>
    <div class="line" id="l3"><span class="w hl" id="hl2">teknolojisine</span></div>
    <div class="line" id="l4" style="font-size:104px;font-weight:900;letter-spacing:-2px;line-height:1.08"><span class="w">güveniyor</span></div>
  </div>

  <div class="abs" id="pill">
    <div id="shine" class="abs"></div>
    <svg width="40" height="52" viewBox="0 0 24 32"><path fill="#fff" d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 32 12 32s12-11.6 12-20.3C24 5.2 18.6 0 12 0zm0 16.3a4.8 4.8 0 1 1 0-9.6 4.8 4.8 0 0 1 0 9.6z"/></svg>
    <span>AJANS İŞBİRLİĞİ</span>
  </div>

  <div class="abs" id="site">melontik.com</div>

  <div id="flash"></div>
</div>

<script>
const DUR = 12;           // saniye — Reels döngüsü
const W = 1080, H = 1920;
const $ = id => document.getElementById(id);

// ---------- easing ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const elastic = k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;

function place(el, cx, cy, { s = 1, r = 0, o = 1 } = {}) {
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.transform = `translate(${cx - w / 2}px, ${cy - h / 2}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
}

// ---------- confetti (seeded, deterministic) ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLORS = ['#FFD166', '#fff', '#FFB36B', '#2A140E', '#FF3D6E'];
const sparks = Array.from({ length: 70 }, () => {
  const el = document.createElement('div');
  el.className = 'spark';
  const sz = 10 + rnd() * 22;
  el.style.width = sz + 'px';
  el.style.height = (rnd() > .5 ? sz : sz * .4) + 'px';
  el.style.background = COLORS[Math.floor(rnd() * COLORS.length)];
  if (rnd() > .6) el.style.borderRadius = '50%';
  $('sparks').appendChild(el);
  return { el, ang: rnd() * Math.PI * 2, spd: 500 + rnd() * 900, spin: (rnd() - .5) * 900, delay: rnd() * .15 };
});

function render(t) {
  // ----- background: living gradient -----
  const hue = Math.sin(t / DUR * Math.PI * 2);
  $('stage').style.background =
    `linear-gradient(${150 + hue * 20}deg, #FF8A4C 0%, #FF5A5F ${45 + hue * 8}%, #B8392C 100%)`;
  const bt = t / DUR * Math.PI * 2;
  $('b1').style.transform = `translate(${-250 + Math.sin(bt) * 160}px, ${-200 + Math.cos(bt) * 200}px)`;
  $('b2').style.transform = `translate(${450 + Math.cos(bt) * 180}px, ${700 + Math.sin(bt * 2) * 160}px)`;
  $('b3').style.transform = `translate(${-200 + Math.sin(bt * 2) * 120}px, ${1300 + Math.cos(bt) * 150}px)`;
  $('streaks').style.transform = `translateX(${(t * 40) % 120}px)`;

  // ----- scene 1: melontik intro (0 – 1.2) -----
  const mIn = backOut(prog(t, .15, .85));
  // ----- scene 2: × + e-adam join (1.1 – 2.3) -----
  const xIn = elastic(prog(t, 1.15, 2.1));
  const eIn = easeOut(prog(t, 1.35, 2.1));
  // ----- scene 3: lockup moves up (3.0 – 3.8) -----
  const up = easeInOut(prog(t, 3.0, 3.8));
  const lockY = lerp(960, 470, up), lockS = lerp(1, .78, up), gap = lerp(250, 200, up);

  const mY = lerp(960, lockY - gap, eIn);
  place($('mCard'), W / 2, mY, { s: lerp(0, 1, mIn) * lockS, o: clamp(mIn * 2), r: lerp(-8, 0, mIn) });
  place($('x'), W / 2, lockY, { s: xIn * lockS, r: lerp(-180, 0, easeOut(prog(t, 1.15, 1.9))), o: clamp(xIn * 3) });
  place($('eCard'), lerp(W + 500, W / 2, eIn), lockY + gap, { s: lockS, r: lerp(10, 0, eIn), o: clamp(eIn * 2) });

  // pulse ring + flash on "×" impact
  const rp = prog(t, 1.55, 2.4);
  place($('ring'), W / 2, lockY, { s: 1 + rp * 7, o: rp > 0 && rp < 1 ? (1 - rp) * .8 : 0 });
  $('flash').style.opacity = (prog(t, 1.55, 1.6) - prog(t, 1.6, 1.9)) * .35;

  // confetti burst
  sparks.forEach(p => {
    const k = prog(t, 1.6 + p.delay, 3.4 + p.delay);
    const d = easeOut(k) * p.spd;
    const x = W / 2 + Math.cos(p.ang) * d;
    const y = 960 + Math.sin(p.ang) * d + k * k * 600;
    p.el.style.transform = `translate(${x}px, ${y}px) rotate(${p.spin * k}deg)`;
    p.el.style.opacity = k > 0 && k < 1 ? 1 - k * k : 0;
  });

  // idle float for lockup after it settles
  const fl = Math.sin(t * 2.2) * 6 * prog(t, 3.8, 4.3);
  if (fl) {
    $('mCard').style.transform += ` translateY(${fl}px)`;
    $('eCard').style.transform += ` translateY(${-fl}px)`;
  }

  // ----- scene 4: headline word-by-word (3.6 – 6.2) -----
  const copy = $('copy');
  place(copy, W / 2, 1060);
  const words = copy.querySelectorAll('.w');
  const starts = [3.6, 3.9, 4.1, 4.6, 5.0, 5.4];
  words.forEach((w, i) => {
    const k = backOut(prog(t, starts[i], starts[i] + .55));
    w.style.opacity = clamp(prog(t, starts[i], starts[i] + .25));
    w.style.transform = `translateY(${lerp(70, 0, k)}px) scale(${lerp(.6, 1, k)})`;
  });
  $('hl1').style.setProperty('--s', easeOut(prog(t, 5.8, 6.3)));
  $('hl2').style.setProperty('--s', easeOut(prog(t, 6.1, 6.7)));
  // heartbeat on "güveniyor"
  const beat = prog(t, 6.8, 7.4);
  if (beat > 0 && beat < 1) words[5].style.transform = `scale(${1 + Math.sin(beat * Math.PI) * .12})`;
  $('tyChip').style.transform = `rotate(${-3 + Math.sin(t * 3) * 2 * prog(t, 4.2, 4.6)}deg)`;

  // ----- scene 5: pill + site (6.8 – 8) -----
  const pIn = backOut(prog(t, 7.0, 7.7));
  place($('pill'), W / 2, lerp(1600, 1370, pIn), { o: clamp(prog(t, 7.0, 7.3)), s: lerp(.8, 1, pIn) });
  const sh = ((t - 7.8) % 2.2) / 1.0;
  $('shine').style.transform = `translateX(${t > 7.8 && sh < 1 ? lerp(-200, 900, sh) : -300}px) skewX(-20deg)`;
  place($('site'), W / 2, 1475, { o: easeOut(prog(t, 7.6, 8.2)) * .9 });

  // ----- outro: fade to loop start (11.4 – 12) -----
  const out = prog(t, 11.4, 12);
  $('stage').querySelectorAll('#mCard,#x,#eCard,#copy,#pill,#site').forEach(el => {
    el.style.opacity = parseFloat(el.style.opacity || 1) * (1 - out);
  });
}

window.render = render;
window.DUR = DUR;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('stage').style.transform = `scale(${s})`;
}

if (new URLSearchParams(location.search).has('capture')) {
  document.body.classList.add('capture');
} else {
  fit(); addEventListener('resize', fit);
  document.fonts.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
